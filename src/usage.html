<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gemini / Claude 剩餘額度</title>
<style>
:root{color-scheme:dark;font:15px/1.5 system-ui,"Microsoft JhengHei",sans-serif;background:#10151d;color:#eaf0f7}
body{max-width:1040px;margin:auto;padding:36px 24px}header{display:flex;justify-content:space-between;align-items:center;gap:20px}h1{font-size:27px;margin:0 0 6px}p{color:#a7b4c6;margin:6px 0}button{background:#283d58;border:1px solid #456080;color:#fff;border-radius:9px;padding:10px 16px;cursor:pointer}button:disabled{opacity:.5;cursor:wait}
#groups{display:grid;gap:20px;margin-top:28px}.group{background:#182230;border:1px solid #2b3c50;border-radius:14px;padding:22px}h2{margin:0 0 5px;font-size:21px}.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:24px;margin-top:22px}.amount{font-size:36px;font-weight:650;letter-spacing:-1px}.amount small{font-size:14px;font-weight:400;letter-spacing:0;color:#b2c0d1;margin-left:7px}.bar{height:9px;border-radius:5px;background:#344153;margin:8px 0 12px;overflow:hidden}.fill{height:100%;background:#69d7b2}.low .fill{background:#f4b06b}.low .amount{color:#f4b06b}.time{font-size:13px;color:#b2c0d1}footer{margin-top:24px;font-size:13px;color:#a7b4c6}#error{color:#ffb5a8;white-space:pre-wrap}a{color:#92bfff}
</style>
<header><div><h1>Gemini / Claude 剩餘額度</h1><p>Antigravity 帳號真實額度 · 每分鐘自動更新</p></div><button id="refresh">立即更新</button></header>
<p id="updated" role="status">正在取得額度…</p><p id="error" role="alert"></p><main id="groups"></main>
<footer>同群組模型共用額度；Argon 會依帳號提供獨立額度。這裡顯示的是 Google／Antigravity 額度，OpenAI 額度仍在 Codex 帳號面板。<br>模型選單的數字會在 Codex 下次刷新模型清單時更新。<br><a href="https://antigravity.google/docs/cli/commands/usage/" target="_blank" rel="noreferrer">額度說明</a></footer>
<script>
const groups=document.querySelector('#groups'),updated=document.querySelector('#updated'),error=document.querySelector('#error'),button=document.querySelector('#refresh');
const percent=new Intl.NumberFormat('zh-TW',{style:'percent',maximumFractionDigits:1});
const time=new Intl.DateTimeFormat('zh-TW',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false,timeZone:'Asia/Taipei'});
async function refresh(force=false){
  button.disabled=true;error.textContent='';
  try{
    const response=await fetch('/v1/usage'+(force?'?refresh=true':''));const data=await response.json();
    if(!response.ok)throw new Error(data.error);
    groups.replaceChildren();
    for(const group of data.groups){
      const section=document.createElement('section');section.className='group';
      const title=document.createElement('h2');title.textContent=group.name==='Gemini Models'?'Gemini 共用額度':group.name==='Claude and GPT models'?'Claude 共用額度（含 GPT-OSS）':group.name;section.append(title);
      const note=document.createElement('p');note.textContent=group.description;section.append(note);
      const grid=document.createElement('div');grid.className='buckets';
      for(const bucket of group.buckets){
        const cell=document.createElement('div');if(bucket.remainingFraction!==null&&bucket.remainingFraction<.1)cell.className='low';
        const label=document.createElement('div');label.textContent=bucket.window==='5h'?'五小時額度':bucket.window==='weekly'?'每週額度':bucket.name;cell.append(label);
        const amount=document.createElement('div');amount.className='amount';amount.textContent=bucket.disabled?'未啟用':bucket.remainingFraction===null?'未知':percent.format(bucket.remainingFraction);const remaining=document.createElement('small');remaining.textContent='剩餘';amount.append(remaining);cell.append(amount);
        const bar=document.createElement('div');bar.className='bar';const fill=document.createElement('div');fill.className='fill';fill.style.width=(bucket.disabled||bucket.remainingFraction===null?0:bucket.remainingFraction*100)+'%';bar.append(fill);cell.append(bar);
        const reset=document.createElement('div');reset.className='time';reset.textContent=bucket.resetTime?'重置：'+time.format(new Date(bucket.resetTime))+'（台北）':'未提供重置時間';cell.append(reset);grid.append(cell);
      }
      section.append(grid);groups.append(section);
    }
    updated.textContent='資料更新：'+time.format(new Date(data.fetchedAt))+'（台北時間）';
  }catch(e){error.textContent='無法更新：'+e.message+'。保留上次顯示的資料，請稍後重試。';}
  finally{button.disabled=false;}
}
button.addEventListener('click',()=>refresh(true));refresh();setInterval(()=>refresh(),60000);
</script>
</html>
